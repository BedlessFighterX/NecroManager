name: NecroManager
version: '${version}'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
description: Lobby, spawn, and gameplay management for Paper servers.
commands:
  clearinventory:
    aliases: [ci, clearinv]
    description: Clears your inventory or an online player's inventory
    permission: necromanager.clearinventory
    usage: /<command> [player]
  more:
    description: Fills the held item stack
    permission: necromanager.more
    usage: /<command>
  hat:
    description: Equips your held item as a helmet
    permission: necromanager.hat
    usage: /<command>
  craft:
    description: Opens a crafting table interface
    permission: necromanager.craft
    usage: /<command>
  anvil:
    description: Opens an anvil interface
    permission: necromanager.anvil
    usage: /<command>
  cleararmor:
    description: Clears armor slots for yourself or an online player
    permission: necromanager.cleararmor
    usage: /<command> [player]
  clearhotbar:
    description: Clears hotbar slots for yourself or an online player
    permission: necromanager.clearhotbar
    usage: /<command> [player]
  skull:
    description: Gives you a head of an online player
    permission: necromanager.skull
    usage: /<command> <player>
  rename:
    description: Renames your held item
    permission: necromanager.rename
    usage: /<command> <name>
  lore:
    description: Adds or clears held item lore
    permission: necromanager.lore
    usage: /<command> <add <text>|clear>
  clearoffhand:
    description: Clears your offhand or an online player's offhand
    permission: necromanager.clearoffhand
    usage: /<command> [player]
  drop:
    description: Drops the item held in your main hand
    permission: necromanager.drop
    usage: /<command>
  iteminfo:
    description: Displays information about the held item
    permission: necromanager.iteminfo
    usage: /<command>
  clearcursor:
    description: Clears the item on your inventory cursor
    permission: necromanager.clearcursor
    usage: /<command>
  itemdurability:
    description: Sets damage on the held damageable item
    permission: necromanager.itemdurability
    usage: /<command> <damage>
  smithingtable:
    description: Open smithing table
    permission: necromanager.smithingtable
    usage: /<command>
  stonecutter:
    description: Open stonecutter
    permission: necromanager.stonecutter
    usage: /<command>
  grindstone:
    description: Open grindstone
    permission: necromanager.grindstone
    usage: /<command>
  cartography:
    description: Open cartography table
    permission: necromanager.cartography
    usage: /<command>
  loom:
    description: Open loom
    permission: necromanager.loom
    usage: /<command>
  enchanting:
    description: Open enchanting table
    permission: necromanager.enchanting
    usage: /<command>
  smithing:
    description: Open smithing interface
    permission: necromanager.smithing
    usage: /<command>
  stone:
    description: Open stonecutter interface
    permission: necromanager.stone
    usage: /<command>
  grind:
    description: Open grindstone interface
    permission: necromanager.grind
    usage: /<command>
  maptable:
    description: Open cartography interface
    permission: necromanager.maptable
    usage: /<command>
  near:
    description: List players within 100 blocks
    permission: necromanager.near
    usage: /<command>
  coords:
    description: Show your coordinates
    permission: necromanager.coords
    usage: /<command>
  compass:
    description: Point compass at world spawn
    permission: necromanager.compass
    usage: /<command>
  clearmychat:
    description: Clear your chat
    permission: necromanager.clearmychat
    usage: /<command>
  removehat:
    description: Remove your helmet
    permission: necromanager.removehat
    usage: /<command>
  workbench:
    description: Open crafting table
    permission: necromanager.workbench
    usage: /<command>
  endersee:
    description: Open your ender chest
    permission: necromanager.endersee
    usage: /<command>
  sortinv:
    description: Sort your inventory
    permission: necromanager.sortinv
    usage: /<command>
  worldinfo:
    description: Show world information
    permission: necromanager.worldinfo
    usage: /<command>
  health:
    description: Show health and hunger
    permission: necromanager.health
    usage: /<command>
  kill:
    description: Kill yourself or an online player
    permission: necromanager.kill
    usage: /<command>
  healall:
    description: Heal all online players
    permission: necromanager.healall
    usage: /<command>
  feedall:
    description: Feed all online players
    permission: necromanager.feedall
    usage: /<command>
  experience:
    description: Grant experience points
    permission: necromanager.experience
    usage: /<command>
  sethealth:
    description: Set health for yourself or a player
    permission: necromanager.sethealth
    usage: /<command>
  worldspawn:
    description: Teleport to vanilla world spawn
    permission: necromanager.worldspawn
    usage: /<command>
  setworldspawn:
    description: Set vanilla world spawn
    permission: necromanager.setworldspawn
    usage: /<command>
  tphere:
    description: Teleport a player to you
    permission: necromanager.tphere
    usage: /<command>
  teleportto:
    description: Teleport to an online player
    permission: necromanager.teleportto
    usage: /<command>
  ptime:
    description: Set your personal time
    permission: necromanager.ptime
    usage: /<command>
  cleareffects:
    description: Removes active potion effects from yourself or an online player
    usage: /<command> [player]
  heal:
    description: Restores health to yourself or an online player
    usage: /<command> [player]
  fly:
    description: Toggles flight for yourself or an online player
    usage: /<command> [player]
  feed:
    description: Restores hunger to yourself or an online player
    usage: /<command> [player]
  extinguish:
    description: Extinguishes yourself or an online player
    usage: /<command> [player]
  ping:
    description: Displays your ping or an online player's ping
    usage: /<command> [player]
  getpos:
    description: Displays your or an online player's world, position, and rotation
    usage: /<command> [player]
  repair:
    description: Repairs damageable items in your hand or inventory
    usage: /<command> [hand|all]
  speed:
    description: Sets walking or flying speed for yourself or a player
    usage: /<command> <1-10> [walk|fly] [player]
  top:
    description: Teleports to the highest safe surface
    usage: /<command>
  bottom:
    description: Teleports to the lowest safe surface
    usage: /<command>
  day:
    description: Sets the current world to daytime
    usage: /<command>
  night:
    description: Sets the current world to nighttime
    usage: /<command>
  weather:
    description: Changes current world weather
    usage: /<command> <clear|rain|thunder>
  broadcast:
    description: Broadcasts an announcement to all players
    usage: /<command> <message>
  clearchat:
    description: Clears visible chat for online players
    usage: /<command>
  rules:
    description: Displays configured server rules
    usage: /<command>
  motd:
    description: Displays configured server message of the day
    usage: /<command>
  list:
    description: Lists online players
    usage: /<command>
  enderchest:
    aliases: [ec]
    description: Opens your ender chest or an online player's ender chest
    usage: /<command> [player]
  invsee:
    description: Opens an online player's inventory for inspection
    usage: /<command> <player>
  gamemode:
    aliases: [gm]
    description: Changes your gamemode or an online player's gamemode
    usage: /<command> <mode> [player]
  reloadmanager:
    description: Reloads the NecroManager configuration
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    aliases: [setlobby]
    description: Sets the NecroManager plugin spawn at your current location
    permission: necromanager.admin
    usage: /<command>
  spawn:
    aliases: [lobby]
    description: Teleports you to the configured NecroManager spawn
    usage: /<command> [player]
  tpcenter:
    description: Teleports you to the center of your current block
    permission: necromanager.admin
    usage: /<command>
