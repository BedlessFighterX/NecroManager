name: NecroManager
version: '${version}'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
description: Lobby, spawn, and gameplay management for Paper servers.
commands:
  clearinventory:
    aliases: [ci, clearinv]
    description: Clears your inventory or an online player's inventory
    permission: necromanager.clearinventory
    usage: /<command> [player]
  more:
    description: Fills the held item stack
    permission: necromanager.more
    usage: /<command>
  hat:
    description: Equips your held item as a helmet
    permission: necromanager.hat
    usage: /<command>
  craft:
    description: Opens a crafting table interface
    permission: necromanager.craft
    usage: /<command>
  anvil:
    description: Opens an anvil interface
    permission: necromanager.anvil
    usage: /<command>
  cleararmor:
    description: Clears armor slots for yourself or an online player
    permission: necromanager.cleararmor
    usage: /<command> [player]
  clearhotbar:
    description: Clears hotbar slots for yourself or an online player
    permission: necromanager.clearhotbar
    usage: /<command> [player]
  skull:
    description: Gives you a head of an online player
    permission: necromanager.skull
    usage: /<command> <player>
  rename:
    description: Renames your held item
    permission: necromanager.rename
    usage: /<command> <name>
  lore:
    description: Adds or clears held item lore
    permission: necromanager.lore
    usage: /<command> <add <text>|clear>
  cleareffects:
    description: Removes active potion effects from yourself or an online player
    usage: /<command> [player]
  heal:
    description: Restores health to yourself or an online player
    usage: /<command> [player]
  fly:
    description: Toggles flight for yourself or an online player
    usage: /<command> [player]
  feed:
    description: Restores hunger to yourself or an online player
    usage: /<command> [player]
  extinguish:
    description: Extinguishes yourself or an online player
    usage: /<command> [player]
  ping:
    description: Displays your ping or an online player's ping
    usage: /<command> [player]
  getpos:
    description: Displays your or an online player's world, position, and rotation
    usage: /<command> [player]
  repair:
    description: Repairs damageable items in your hand or inventory
    usage: /<command> [hand|all]
  speed:
    description: Sets walking or flying speed for yourself or a player
    usage: /<command> <1-10> [walk|fly] [player]
  top:
    description: Teleports to the highest safe surface
    usage: /<command>
  bottom:
    description: Teleports to the lowest safe surface
    usage: /<command>
  day:
    description: Sets the current world to daytime
    usage: /<command>
  night:
    description: Sets the current world to nighttime
    usage: /<command>
  weather:
    description: Changes current world weather
    usage: /<command> <clear|rain|thunder>
  broadcast:
    description: Broadcasts an announcement to all players
    usage: /<command> <message>
  clearchat:
    description: Clears visible chat for online players
    usage: /<command>
  rules:
    description: Displays configured server rules
    usage: /<command>
  motd:
    description: Displays configured server message of the day
    usage: /<command>
  list:
    description: Lists online players
    usage: /<command>
  enderchest:
    aliases: [ec]
    description: Opens your ender chest or an online player's ender chest
    usage: /<command> [player]
  invsee:
    description: Opens an online player's inventory for inspection
    usage: /<command> <player>
  gamemode:
    aliases: [gm]
    description: Changes your gamemode or an online player's gamemode
    usage: /<command> <mode> [player]
  reloadmanager:
    description: Reloads the NecroManager configuration
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    aliases: [setlobby]
    description: Sets the NecroManager plugin spawn at your current location
    permission: necromanager.admin
    usage: /<command>
  spawn:
    aliases: [lobby]
    description: Teleports you to the configured NecroManager spawn
    usage: /<command> [player]
  tpcenter:
    description: Teleports you to the center of your current block
    permission: necromanager.admin
    usage: /<command>
permissions:
  necromanager.clearinventory:
    description: Clear your own inventory
    default: op
  necromanager.clearinventory.others:
    description: Clear another player's inventory
    default: op
  necromanager.more:
    description: Fill the held item stack
    default: op
  necromanager.hat:
    description: Equip an item as a helmet
    default: op
  necromanager.craft:
    description: Open a crafting interface
    default: true
  necromanager.anvil:
    description: Open an anvil interface
    default: true
  necromanager.cleararmor:
    description: Clear your armor
    default: op
  necromanager.cleararmor.others:
    description: Clear another player's armor
    default: op
  necromanager.clearhotbar:
    description: Clear your hotbar
    default: op
  necromanager.clearhotbar.others:
    description: Clear another player's hotbar
    default: op
  necromanager.skull:
    description: Create player heads
    default: op
  necromanager.rename:
    description: Rename held items
    default: op
  necromanager.lore:
    description: Edit held item lore
    default: op
  necromanager.cleareffects:
    description: Allows use of the cleareffects command
    default: op
  necromanager.heal:
    description: Allows use of the heal command
    default: op
  necromanager.fly:
    description: Allows use of the fly command
    default: op
  necromanager.feed:
    description: Allows use of the feed command
    default: op
  necromanager.extinguish:
    description: Allows use of the extinguish command
    default: op
  necromanager.ping:
    description: Allows use of the ping command
    default: true
  necromanager.getpos:
    description: Allows use of the getpos command
    default: op
  necromanager.repair:
    description: Allows use of the repair command
    default: op
  necromanager.speed:
    description: Allows changing your own walk or fly speed
    default: op
  necromanager.speed.others:
    description: Allows changing another player's walk or fly speed
    default: op
  necromanager.top:
    description: Allows use of the top command
    default: true
  necromanager.bottom:
    description: Allows use of the bottom command
    default: true
  necromanager.world:
    description: Allows changing world time and weather
    default: op
  necromanager.broadcast:
    description: Allows broadcasting server announcements
    default: op
  necromanager.clearchat:
    description: Allows clearing player chat
    default: op
  necromanager.enderchest:
    description: Allows use of the enderchest command
    default: op
  necromanager.invsee:
    description: Allows inspection of online player inventories
    default: op
  necromanager.gamemode:
    description: Allows changing your own gamemode
    default: op
  necromanager.gamemode.others:
    description: Allows changing another player's gamemode
    default: op
  necromanager.admin:
    description: Allows administration of NecroManager commands
    default: op
  necromanager.spawn:
    description: Allows use of the spawn command
    default: true
  necromanager.blockbreak:
    description: Bypasses NecroManager block-break restrictions
    default: op
  necromanager.blockplace:
    description: Bypasses NecroManager block-place restrictions
    default: op
  necromanager.damage-others:
    description: Bypasses NecroManager player-damage restrictions
    default: op
  necromanager.falldamage:
    description: Bypasses NecroManager fall-damage restrictions
    default: op
  necromanager.silent-join:
    description: Hides the player from NecroManager join messages
    default: op
  necromanager.silent-leave:
    description: Hides the player from NecroManager quit messages
    default: op
