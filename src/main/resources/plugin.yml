name: NecroManager
version: '${version}'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
description: Lobby, spawn, and gameplay management for Paper servers.
commands:
  cleareffects:
    description: Removes active potion effects from yourself or an online player
    usage: /<command> [player]
  heal:
    description: Restores health to yourself or an online player
    usage: /<command> [player]
  fly:
    description: Toggles flight for yourself or an online player
    usage: /<command> [player]
  feed:
    description: Restores hunger to yourself or an online player
    usage: /<command> [player]
  enderchest:
    aliases: [ec]
    description: Opens your ender chest or an online player's ender chest
    usage: /<command> [player]
  invsee:
    description: Opens an online player's inventory for inspection
    usage: /<command> <player>
  reloadmanager:
    description: Reloads the NecroManager configuration
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    aliases: [setlobby]
    description: Sets the NecroManager plugin spawn at your current location
    permission: necromanager.admin
    usage: /<command>
  spawn:
    aliases: [lobby]
    description: Teleports you to the configured NecroManager spawn
    usage: /<command> [player]
  tpcenter:
    description: Teleports you to the center of your current block
    permission: necromanager.admin
    usage: /<command>
permissions:
  necromanager.cleareffects:
    description: Allows use of the cleareffects command
    default: op
  necromanager.heal:
    description: Allows use of the heal command
    default: op
  necromanager.fly:
    description: Allows use of the fly command
    default: op
  necromanager.feed:
    description: Allows use of the feed command
    default: op
  necromanager.enderchest:
    description: Allows use of the enderchest command
    default: op
  necromanager.invsee:
    description: Allows inspection of online player inventories
    default: op
  necromanager.admin:
    description: Allows administration of NecroManager commands
    default: op
  necromanager.spawn:
    description: Allows use of the spawn command
    default: true
  necromanager.blockbreak:
    description: Bypasses NecroManager block-break restrictions
    default: op
  necromanager.blockplace:
    description: Bypasses NecroManager block-place restrictions
    default: op
  necromanager.damage-others:
    description: Bypasses NecroManager player-damage restrictions
    default: op
  necromanager.falldamage:
    description: Bypasses NecroManager fall-damage restrictions
    default: op
  necromanager.silent-join:
    description: Hides the player from NecroManager join messages
    default: op
  necromanager.silent-leave:
    description: Hides the player from NecroManager quit messages
    default: op
