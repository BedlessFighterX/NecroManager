name: NecroManager
version: '${version}'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
description: Lobby, spawn, and gameplay management for Paper servers.
commands:
  cleareffects:
    description: Removes active potion effects from yourself or an online player
    usage: /<command> [player]
  heal:
    description: Restores health to yourself or an online player
    usage: /<command> [player]
  fly:
    description: Toggles flight for yourself or an online player
    usage: /<command> [player]
  feed:
    description: Restores hunger to yourself or an online player
    usage: /<command> [player]
  extinguish:
    description: Extinguishes yourself or an online player
    usage: /<command> [player]
  ping:
    description: Displays your ping or an online player's ping
    usage: /<command> [player]
  getpos:
    description: Displays your or an online player's world, position, and rotation
    usage: /<command> [player]
  repair:
    description: Repairs damageable items in your hand or inventory
    usage: /<command> [hand|all]
  speed:
    description: Sets walking or flying speed for yourself or a player
    usage: /<command> <1-10> [walk|fly] [player]
  top:
    description: Teleports to the highest safe surface
    usage: /<command>
  bottom:
    description: Teleports to the lowest safe surface
    usage: /<command>
  day:
    description: Sets the current world to daytime
    usage: /<command>
  night:
    description: Sets the current world to nighttime
    usage: /<command>
  weather:
    description: Changes current world weather
    usage: /<command> <clear|rain|thunder>
  enderchest:
    aliases: [ec]
    description: Opens your ender chest or an online player's ender chest
    usage: /<command> [player]
  invsee:
    description: Opens an online player's inventory for inspection
    usage: /<command> <player>
  gamemode:
    aliases: [gm]
    description: Changes your gamemode or an online player's gamemode
    usage: /<command> <mode> [player]
  reloadmanager:
    description: Reloads the NecroManager configuration
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    aliases: [setlobby]
    description: Sets the NecroManager plugin spawn at your current location
    permission: necromanager.admin
    usage: /<command>
  spawn:
    aliases: [lobby]
    description: Teleports you to the configured NecroManager spawn
    usage: /<command> [player]
  tpcenter:
    description: Teleports you to the center of your current block
    permission: necromanager.admin
    usage: /<command>
permissions:
  necromanager.cleareffects:
    description: Allows use of the cleareffects command
    default: op
  necromanager.heal:
    description: Allows use of the heal command
    default: op
  necromanager.fly:
    description: Allows use of the fly command
    default: op
  necromanager.feed:
    description: Allows use of the feed command
    default: op
  necromanager.extinguish:
    description: Allows use of the extinguish command
    default: op
  necromanager.ping:
    description: Allows use of the ping command
    default: true
  necromanager.getpos:
    description: Allows use of the getpos command
    default: op
  necromanager.repair:
    description: Allows use of the repair command
    default: op
  necromanager.speed:
    description: Allows changing your own walk or fly speed
    default: op
  necromanager.speed.others:
    description: Allows changing another player's walk or fly speed
    default: op
  necromanager.top:
    description: Allows use of the top command
    default: true
  necromanager.bottom:
    description: Allows use of the bottom command
    default: true
  necromanager.world:
    description: Allows changing world time and weather
    default: op
  necromanager.enderchest:
    description: Allows use of the enderchest command
    default: op
  necromanager.invsee:
    description: Allows inspection of online player inventories
    default: op
  necromanager.gamemode:
    description: Allows changing your own gamemode
    default: op
  necromanager.gamemode.others:
    description: Allows changing another player's gamemode
    default: op
  necromanager.admin:
    description: Allows administration of NecroManager commands
    default: op
  necromanager.spawn:
    description: Allows use of the spawn command
    default: true
  necromanager.blockbreak:
    description: Bypasses NecroManager block-break restrictions
    default: op
  necromanager.blockplace:
    description: Bypasses NecroManager block-place restrictions
    default: op
  necromanager.damage-others:
    description: Bypasses NecroManager player-damage restrictions
    default: op
  necromanager.falldamage:
    description: Bypasses NecroManager fall-damage restrictions
    default: op
  necromanager.silent-join:
    description: Hides the player from NecroManager join messages
    default: op
  necromanager.silent-leave:
    description: Hides the player from NecroManager quit messages
    default: op
