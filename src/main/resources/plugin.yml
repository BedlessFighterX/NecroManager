name: NecroManager
version: '${version}'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
description: Lobby, spawn, and gameplay management for Paper servers.
commands:
  reloadmanager:
    description: Reloads the NecroManager configuration
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    aliases: [setlobby]
    description: Sets the server spawn at your current location
    permission: necromanager.admin
    usage: /<command>
  spawn:
    aliases: [lobby]
    description: Teleports you to the configured spawn
    permission: necromanager.spawn
    usage: /<command>
  tpcenter:
    description: Teleports you to the center of your current block
    permission: necromanager.admin
    usage: /<command>
permissions:
  necromanager.admin:
    description: Allows administration of NecroManager commands
    default: op
  necromanager.spawn:
    description: Allows use of the spawn command
    default: true
  necromanager.blockbreak:
    description: Bypasses NecroManager block-break restrictions
    default: op
  necromanager.blockplace:
    description: Bypasses NecroManager block-place restrictions
    default: op
  necromanager.damage-others:
    description: Bypasses NecroManager player-damage restrictions
    default: op
  necromanager.falldamage:
    description: Bypasses NecroManager fall-damage restrictions
    default: op
  necromanager.silent-join:
    description: Hides the player from NecroManager join messages
    default: op
  necromanager.silent-leave:
    description: Hides the player from NecroManager quit messages
    default: op
