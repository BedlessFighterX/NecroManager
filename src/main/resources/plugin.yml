name: NecroManager
version: '1.0'
main: com.bedlessfighter.necroManager.Main
api-version: '1.21'
commands:
  reloadmanager:
    description: Reloads the necromanager plugin
    permission: necromanager.admin
    usage: /<command>
  setspawn:
    description: Sets spawn location for the server
    permission: necromanager.admin
    usage: /<command>
  spawn:
    description: Teleports the player to the spawn
    permission: necromanager.admin
    usage: /<command>
  tpcenter:
    description: Teleports the staff to the center of the block
    permission: necromanager.admin
    usage: /<command>
permissions:
  necromanager.admin:
    description: Makes the player immune to plugin actions
    default: op
  necromanager.breakblock:
    description: Makes the player immune to plugin affects on block breaking events
    default: op
  necromanager.blockplace:
    description: Makes the player immune to plugin affects on block placing events
    default: op
  necromanager.silent-join:
    description: Makes the player invisible to plugin join listener
    default: op
  necromanager.silent-leave:
    description: Makes the player invisible to plugin leave listener
    default: op