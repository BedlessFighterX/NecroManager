# Configuration for SpaceManager
# Developed by @bacheyerasht on Discord
# Private plugin for SpaceMC at https://discord.gg/C6aZffxXUd
# Open a ticket for furthur support of this plugin!

disabler:
  blockplace: true
  blockbreak: true
  damage-others: true
  fall-damage: true

effects:
  enabled: true
  speed: true
  feather-falling: true
  regeneration: true

joins:
  enabled: true
  spawn-on-join: true
  message: "&8[&a+&8] &f%player%"
  silent-staffs: true

quit:
  enabled: true
  message: "&8[&c-&8] &f%player%"
  silent-staffs: true

messages:
  prefix: "&b&lSPACE&9&lMC &8|&r"
  blockbreak: "&cYou may not break blocks in this territory."
  blockplace: "&cYou may not place blocks in this territory."
  no-perm: "&cYou don't have enough permissions to do this!"
  damage-others: "&cYou may not damage other players."
  spawnmessage: "&rYou have been &ateleported&r to the &espawn!"