# Configuration for NecroManager

# Plugin spawn is independent from Minecraft's world spawn by default.
# Set true only if /setspawn should also move the world's vanilla spawn point.
spawn:
  update-world-spawn: false
  safe-teleport: true
  safe-search-radius: 4
  safe-search-height: 3

disabler:
  blockplace: true
  blockbreak: true
  damage-others: true
  fall-damage: true

# Optional per-world restriction overrides keyed by world UUID.
# Example:
# world-overrides:
#   00000000-0000-0000-0000-000000000000:
#     disabler:
#       blockbreak: false
#       blockplace: false
#       damage-others: false
#       fall-damage: false
#     deaths:
#       enabled: false
world-overrides: {}

effects:
  enabled: true
  duration-seconds: 86400
  speed-amplifier: 2
  regeneration-amplifier: 10
  slow-falling-amplifier: 10
  speed: true
  feather-falling: true
  regeneration: true

joins:
  enabled: true
  spawn-on-join: true
  message: "&8[&a+&8] &f%player%"
  silent-staffs: true
  first-join-message-enabled: false
  first-join-message: "&aWelcome %player% to the server!"
  motd:
    enabled: false
    lines:
      - "&aWelcome to the server, &f%player%&a!"
      - "&7There are &f%online%&7 players online."
  title:
    enabled: false
    text: "&aWelcome!"
    subtitle: "&7Enjoy your stay, %player%."
    fade-in: 10
    stay: 60
    fade-out: 20
  actionbar:
    enabled: false
    text: "&aWelcome, %player%!"
  sound:
    enabled: false
    name: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  firework:
    enabled: false
    power: 1
    type: BALL
    instant: true
  # Ordered join actions; each entry supports type, value, delay-ticks and optional permission.
  # Types: message, broadcast, title, actionbar, sound, command, console, gamemode, effect, close.
  actions:
    enabled: false
    entries: []
  items:
    enabled: false
    entries:
      - material: COMPASS
        slot: 0
        amount: 1
        name: "&aServer Selector"
        lore:
          - "&7Right-click to choose a server."
        action: SERVER_SELECTOR
      - material: PLAYER_HEAD
        slot: 8
        amount: 1
        name: "&ePlayer Visibility"
        lore:
          - "&7Right-click to hide or show players."
        action: PLAYER_HIDER

menus:
  server-selector:
    title: "&8Select a server"
    entries:
      # Configure entries with a slot, material, name, lore, and proxy server name.
      # - slot: 11
      #   material: GRASS_BLOCK
      #   name: "&aSurvival"
      #   lore: ["&7Join the survival server."]
      #   server: survival

respawn:
  use-plugin-spawn: false

deaths:
  enabled: true

quit:
  enabled: true
  message: "&8[&c-&8] &f%player%"
  silent-staffs: true

motd:
  - "&aWelcome to the server!"
rules:
  - "&71. Be respectful."
  - "&72. No cheating."
  - "&73. Follow staff instructions."

messages:
  prefix: "&a&lNECRO&f&lMC &8|&r"
  blockbreak: "&cYou may not break blocks in this territory."
  blockplace: "&cYou may not place blocks in this territory."
  damage-others: "&cYou may not damage other players."
  fall-damage: "&cFall damage is disabled in this area."
  spawnmessage: "&rYou have been &ateleported&r to the &espawn!"
  spawn-not-set: "&cSpawn has not been set yet."
  spawn-failed: "&cCould not complete the spawn operation."
  spawn-unsafe: "&cNo safe location could be found near the configured spawn."
  player-not-found: "&cThat player is not online."
  spawn-other-success: "&aTeleported %player% to spawn."
  setspawn: "&aSpawn location has been updated."
  no-perm: "&cYou don't have enough permissions to issue this command!"
  reload: "&aConfiguration reloaded successfully."
  reload-failed: "&cConfiguration reload failed. Check the server console."
  tpcenter: "&rYou have been centered &asuccessfully!"
  player-required: "&cConsole must specify an online player."
  heal-self: "&aYou have been healed."
