  interaction-disabled: "&cBlock interaction is disabled."
  drop-disabled: "&cDropping items is disabled."
  offhand-disabled: "&cOffhand swapping is disabled."
  rules-header: "&6&lServer Rules"
  list: "&aOnline (&f%count%&a): &f%players%"
  death-prefix: "&8[&c☠&8]"

# Hub presentation. Placeholders: %player%, %displayname%, %world%, %online%, %max%.
hub:
  scoreboard:
    enabled: true
    title: "&a&lNecroManager"
    lines:
      - "&7Player"
      - "&f%player%"
      - "&8 "
      - "&7Online"
      - "&f%online%&7/&f%max%"
      - "&8  "
      - "&7World"
      - "&f%world%"
  tablist:
    enabled: true
    header:
      - "&a&lNecroManager"
      - "&7Welcome, &f%displayname%"
    footer:
      - "&7Online: &f%online%&7/&f%max%"
      - "&aHave a great time!"

announcements:
  enabled: false
  interval-seconds: 300
  minimum-online: 1
  messages:
    - "&aWelcome! Read /rules to learn the server rules."
    - "&eThere are currently &f%online%&e players online."
  disabled-worlds: []
  chat:
    enabled: true
  title:
    enabled: false
    text: "&aAnnouncement"
    subtitle: "%message%"
    fade-in: 10
    stay: 50
    fade-out: 10
  actionbar:
    enabled: false
  sound:
    enabled: false
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1
    pitch: 1

chat:
  locked: false
  locked-message: "&cChat is currently locked."
  clear-lines: 100
  cleared-message: "&cChat was cleared by staff."
  self-cleared-message: "&aYour chat has been cleared."

anti-swear:
  enabled: false
  words: []
  replacement: "[filtered]"
  staff-alerts: true
  alert-message: "&c[ChatFilter] &f%player% used a filtered word: &7%message%"

command-blocklist:
  enabled: true
  message: "&cThat command is disabled."
  commands: []

# Hub protections. Staff can bypass player-specific restrictions with permissions.
protections:
  block-interaction: false
  hunger: false
  item-drop: false
  item-pickup: false
  mob-spawning: false
  void-damage: false
  fire-damage: false
  drowning-damage: false
  offhand-swap: false
  fire-spread: false
  block-burn: false
  leaf-decay: false
  weather-lock: false

# Hub movement abilities. Cooldowns are tracked per player and reset on disconnect.
movement:
  launchpads:
    enabled: false
    blocks: [SLIME_BLOCK]
    horizontal: 1.8
    vertical: 1.1
    cooldown-seconds: 2
    sound: ENTITY_SLIME_JUMP
  double-jump:
    enabled: false
    vertical: 0.85
    cooldown-seconds: 3
    sound: ENTITY_BAT_TAKEOFF

# Explicit World Downloader plugin-message handshakes are alert-only evidence.
# Channels can be spoofed and not every downloader sends them; never auto-punish.
anti-world-downloader:
  enabled: false
  staff-alerts: true
  alert-message: "&c[Anti-WDL] &f%player% sent a World Downloader handshake (&7%channel%&f)."
