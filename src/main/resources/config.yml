# Configuration for NecroManager

# Plugin spawn is independent from Minecraft's world spawn by default.
# Set true only if /setspawn should also move the world's vanilla spawn point.
spawn:
  update-world-spawn: false
  safe-teleport: true
  safe-search-radius: 4
  safe-search-height: 3

disabler:
  blockplace: true
  blockbreak: true
  damage-others: true
  fall-damage: true

# Optional per-world restriction overrides keyed by world UUID.
# Example:
# world-overrides:
#   00000000-0000-0000-0000-000000000000:
#     disabler:
#       blockbreak: false
#       blockplace: false
#       damage-others: false
#       fall-damage: false
#     deaths:
#       enabled: false
world-overrides: {}

effects:
  enabled: true
  duration-seconds: 86400
  speed-amplifier: 2
  regeneration-amplifier: 10
  slow-falling-amplifier: 10
  speed: true
  feather-falling: true
  regeneration: true

joins:
  enabled: true
  spawn-on-join: true
  message: "&8[&a+&8] &f%player%"
  silent-staffs: true
  first-join-message-enabled: false
  first-join-message: "&aWelcome %player% to the server!"

respawn:
  use-plugin-spawn: false

deaths:
  enabled: true

quit:
  enabled: true
  message: "&8[&c-&8] &f%player%"
  silent-staffs: true

motd:
  - "&aWelcome to the server!"
rules:
  - "&71. Be respectful."
  - "&72. No cheating."
  - "&73. Follow staff instructions."

messages:
  prefix: "&a&lNECRO&f&lMC &8|&r"
  blockbreak: "&cYou may not break blocks in this territory."
  blockplace: "&cYou may not place blocks in this territory."
  damage-others: "&cYou may not damage other players."
  fall-damage: "&cFall damage is disabled in this area."
  spawnmessage: "&rYou have been &ateleported&r to the &espawn!"
  spawn-not-set: "&cSpawn has not been set yet."
  spawn-failed: "&cCould not complete the spawn operation."
  spawn-unsafe: "&cNo safe location could be found near the configured spawn."
  player-not-found: "&cThat player is not online."
  spawn-other-success: "&aTeleported %player% to spawn."
  setspawn: "&aSpawn location has been updated."
  no-perm: "&cYou don't have enough permissions to issue this command!"
  reload: "&aConfiguration reloaded successfully."
  reload-failed: "&cConfiguration reload failed. Check the server console."
  tpcenter: "&rYou have been centered &asuccessfully!"
  player-required: "&cConsole must specify an online player."
  heal-self: "&aYou have been healed."
  healed-by-admin: "&aAn administrator healed you."
  heal-other: "&aHealed %player%."
  heal-failed: "&cCould not determine the target's maximum health."
  feed-self: "&aYour hunger has been restored."
  fed-by-admin: "&aAn administrator restored your hunger."
  feed-other: "&aRestored hunger for %player%."
  extinguish-self: "&aYou have been extinguished."
  extinguish-target: "&eAn administrator extinguished you."
  extinguish-other: "&aExtinguished %player%."
  ping: "&a%player% &7has &e%ping% ms&7 ping."
  getpos: "&a%player% &7is in &e%world%&7 at &e%x%, %y%, %z%&7 (yaw &e%yaw%&7, pitch &e%pitch%&7)."
  repair-player-only: "&cOnly players can use this command."
  repair-result: "&aRepaired &e%count%&a item(s)."
  cleareffects-self: "&aRemoved %count% active potion effects."
  cleareffects-target: "&eAn administrator cleared your active potion effects."
  cleareffects-other: "&aRemoved %count% potion effects from %player%."
  fly-enabled: "&aFlight enabled."
  fly-disabled: "&cFlight disabled."
  fly-enabled-target: "&aAn administrator enabled flight for you."
  fly-disabled-target: "&cAn administrator disabled flight for you."
  fly-enabled-other: "&aEnabled flight for %player%."
  fly-disabled-other: "&cDisabled flight for %player%."
  enderchest-self: "&aOpened your ender chest."
