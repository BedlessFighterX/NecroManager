name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run checks and build
        run: bash ./gradlew --no-daemon clean check build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NecroManager-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful build artifact
        uses: actions/download-artifact@v4
        with:
          name: NecroManager-${{ github.sha }}
          path: release-assets
      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-assets/*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one plugin JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          sha256sum "${jars[0]}" > "${jars[0]}.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NecroManager v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*.jar
            release-assets/*.jar.sha256
