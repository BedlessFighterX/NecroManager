name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run checks and build
        run: bash ./gradlew --no-daemon clean check build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NecroManager-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release artifact
        run: bash ./gradlew --no-daemon clean check build
      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one plugin JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          sha256sum "${jars[0]}" > "${jars[0]}.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: NecroManager ${GITHUB_REF_NAME}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.jar.sha256
